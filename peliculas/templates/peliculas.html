<h1>Registro de Películas</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <label>Título:</label>
    <input type="text" name="titulo">

    <br><br>

    <label>Imagen:</label>
    <input type="file" name="imagen">

    <br><br>

    <button type="submit">
        Guardar
    </button>

</form>
