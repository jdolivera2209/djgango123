<h1>Productos</h1>

<table border="1">

    <tr>
        <td>Nombre</td>
        <td>Cantidad</td>
        <td>Precio</td>
    </tr>

    {% for p in productos %}

    <tr>
        <td>{{ p.nombre }}</td>
        <td>{{ p.cantidad }}</td>
        <td>{{ p.precio }}</td>
    </tr>

    {% endfor %}

</table>
